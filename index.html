<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vercel Test Site</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #0f172a;
      --card: rgba(255,255,255,0.1);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }
    .card {
      width: min(92vw, 720px);
      padding: 40px 28px;
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 6vw, 56px);
      line-height: 1.05;
    }
    p {
      margin: 10px 0;
      font-size: 18px;
      color: var(--muted);
      line-height: 1.7;
    }
    .tag {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(34,197,94,0.14);
      color: #bbf7d0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .btn {
      display: inline-block;
      margin-top: 18px;
      text-decoration: none;
      background: var(--accent);
      color: #052e16;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="tag">DEPLOYED ON VERCEL</div>
    <h1>测试网站已准备好</h1>
    <p>这是一个最小可用的测试页，用来验证 GitHub → Vercel 的部署流程是否正常。</p>
    <p>仓库准备完成后，你只需要在 Vercel 里导入这个仓库，就可以一键上线。</p>
    <a class="btn" href="https://github.com/1351468279/boke" target="_blank" rel="noreferrer">查看 GitHub 仓库</a>
  </main>
</body>
</html>
